<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Rites</title>

  <!-- Load password values -->
  <script src="../Staff/Owners/passwords.js"></script>
  <script src="script.js" defer></script>

  <!-- Password check -->
<!-- Loads password value from external file and prompts user to enter it.
     If incorrect, the page is replaced with an 'Access Denied' message.
     If correct, redirects user to the Owner page. --> 
<script src="Pages/Staff/Owners/passwords.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const userInput = prompt("Enter the password to view this page:");

    if (userInput !== password1a) {
      document.body.innerHTML = "<h2>Access Denied</h2><p>Incorrect password.</p>";
    } else {
      window.location.href = "../Staff/Owners/index.html";
    }
  });
</script>
  
</head>
<body>
  <nav>
    <a href="../Home/">Home</a> |
    <a href="../Staff/">Staff</a>
  </nav>

  <h1>Welcome to Rites</h1>
  <p>This is the home page.</p>

  <div>
    <label for="accessCode">Owner Access Code:</label>
    <input type="text" id="accessCode" />
    <button onclick="checkCode()">Submit</button>
  </div>

  <script>
    function checkCode() {
      const input = document.getElementById("accessCode").value;
      if (input === password1b) {
        window.location.href = "../Staff/Owner/";
      } else {
        alert("Incorrect code. Access denied.");
      }
    }
  </script>
</body>
</html>
