<!DOCTYPE html>

<script src="Owners/passwords.js"></script>
<script src="Owners/doclists.js"></script>
<script src="Owners/renderLists.js"></script>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RitesCommunities – Work Forms & Files</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      background: #f4f4f4;
      padding: 20px;
      border-radius: 12px;
    }
    h1, h2 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
      padding: 10px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    a {
      text-decoration: none;
      color: #0077cc;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>RitesCommunities</h1>
  <h2>📁 Work Forms & Files</h2>

  <ul id="file-list"></ul>
  <ul id="fileList2"></ul>
  <script>
    const fileList = document.getElementById('file-list');
    files.forEach(file => {
      const li = document.createElement('li');
      const link = document.createElement('a');
      link.href = file.link;
      link.textContent = file.name;
      link.target = "_blank";
      li.appendChild(link);
      fileList.appendChild(li);

      renderList("list3", "fileList3");
      
    });


    <script>
</body>
</html>
